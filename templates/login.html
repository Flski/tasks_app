<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>Авторизация</title>
    <style>
        body {
            color: #F5F5F5;
            background: #1A1A1A;
            font-family: "Arial";
            font-size: 14px;
            font-weight: bold;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        form {
            text-align: center;
        }
        .login , .password , .button {
            color: #1A1A1A;
            background: #F5F5F5;
            font-size: 14px;
            font-family: Arial;
        }
        h1 {
            font-size: 14px;
        }
        a {
            text-decoration: none;
            color: #F5F5F5;
        }
        .error_l {
            color: #F5F5F5;
            border: 1px solid #F5F5F5;
        }
    </style>
</head>
<body>
<form action="/login" method="post">
  <h1>Авторизация</h1>
  {% if error_l != False %}
  <p class="error_l">{{error_l}}</p>
  {% endif %}
  <p><label>Логин: </label><input class="login" type="text" name="login_" value="" required></p>
  <p><label>Пароль: </label><input class="password" type="password" name="password_" value="" required></p>
  <p><input class="button" type="submit" value="Войти"></p>
  <p><a href="/registration">Регистрация</a></p>
</form>
</body>
</html>
