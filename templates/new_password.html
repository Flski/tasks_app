<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>Изменить пароль</title>
    <style>
      body {
            color: #F5F5F5;
            background: #1A1A1A;
            font-family: Arial;
            font-size: 14px;
            font-weight: bold;
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 4px;
        }
        ul {
            background: #1A1A1A;
            border: 1px solid #A8E4A0;
            padding: 0;
            margin: 0;
            overflow: hidden;
            list-style: none;
        }
        li {
            font-size: 18px;
            color: #A8E4A0;
            float: left;
            margin: 10px;
            padding: 7px;
        }
        li a {
            color: #A8E4A0;
            text-decoration: none;
        }
        li a:hover {
            color: #F5F5F5;
        }
        h1 {
            font-size: 14px;
        }
        form {
            text-align: center;
        }
        .password , .new_password , .button {
            color: #1A1A1A;
            background: #F5F5F5;
            font-family: Arial;
            font-size: 14px;
        }
        .error_np {
            border: 1px solid #F5F5F5;
        }
    </style>
</head>
<body>
<ul>
    {% if len_login <= 24 %}
    <li>Профиль: {{login}}</li>
    {% else %}
    <li>Профиль: {{login[:24]}}...</li>
    {% endif %}
    <li><a href="/tasks?login={{login}}">Задачи</a></li>
    <li><a href="/add_task?login={{login}}">Добавить задачу</a></li>
    <li><a href="/exit?login={{login}}">Выйти</a></li>
</ul>
<form action="/new_password?login={{login}}" method="post">
  <h1>Изменить пароль</h1>
  {% if error_np != False %}
  <p class="error_np">{{error_np}}</p>
  {% endif %}
  <p><label>Текущий пароль: </label><input class="password" type="password" name="password_" value="" required></p>
  <p><label>Новый пароль: </label><input class="new_password" type="password" name="password1_" value="" required></p>
  <p><input class="button" type="submit" value="Изменить пароль"></p>
</form>
</body>
</html>
